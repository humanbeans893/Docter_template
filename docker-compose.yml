services:
  research-template:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    # No fixed container_name: repos derived from this template must be able to
    # run side by side (compose derives a unique name per project directory).
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    # The project environment is baked into the image at /opt/venv (Dockerfile).
    # HOME and the caches also stay outside the bind-mounted /workspace, so
    # nothing environment-related is written back to the host.
    environment:
      HOME: /home/app
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uv-cache
      XDG_CACHE_HOME: /home/app/.cache
      # Keep import-time __pycache__ off the bind mount as well.
      PYTHONPYCACHEPREFIX: /home/app/.cache/pycache
      RUFF_CACHE_DIR: /home/app/.cache/ruff
      # Print as it happens when stdout is not a terminal (docker compose exec -T, an agent).
      PYTHONUNBUFFERED: "1"
    volumes:
      # Tool state under HOME (shell history, compiled caches) and the uv cache
      # survive container re-creation.
      - home:/home/app
      - uv-cache:/opt/uv-cache
      - .:/workspace
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # No published ports: nothing listens on the host, so repos derived from this template
    # never clash over a host port (a fixed one fails the first start when another project's
    # container holds it).
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: ["bash"]

volumes:
  home:
  uv-cache:
