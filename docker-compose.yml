services:
  research-template:
    build: .
    image: research-template:latest
    container_name: research-template
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /workspace
      XDG_CACHE_HOME: /workspace/.cache
      UV_CACHE_DIR: /workspace/.cache/uv
      MPLCONFIGDIR: /workspace/.cache/matplotlib
    volumes:
      - .:/workspace
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8889:8888"
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: ["bash"]
