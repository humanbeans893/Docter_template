services:
  research-template:
    build: .
    image: research-template:latest
    # No fixed container_name: repos derived from this template must be able to
    # run side by side (compose derives a unique name per project directory).
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace
    environment:
      HOME: /workspace
      XDG_CACHE_HOME: /workspace/.cache
      UV_CACHE_DIR: /workspace/.cache/uv
      MPLCONFIGDIR: /workspace/.cache/matplotlib
    volumes:
      - .:/workspace
    shm_size: "16g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      # Host port is configurable so multiple template-derived repos can run at
      # once: set JUPYTER_PORT in a local .env file (see .env.example).
      - "${JUPYTER_PORT:-8889}:8888"
    restart: unless-stopped
    tty: true
    stdin_open: true
    command: ["bash"]
