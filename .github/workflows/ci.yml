name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked --all-groups
      - name: Test
        run: uv run pytest
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Public repository safety check
        run: uv run python tools/public_repo_check.py

  thesis:
    name: Thesis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install LuaLaTeX toolchain
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          texlive-luatex texlive-lang-japanese texlive-latex-extra texlive-science
      - name: Build main, review, submission and supplementary PDFs
        run: bash draft/compile.sh all
      - name: Check dissertation
        run: python3 tools/thesis_check.py --all
