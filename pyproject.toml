[project]
name = "doctoral-thesis"
version = "0.1.0"
description = "Doctoral thesis template that gathers research from separate research repositories"
readme = "README.md"
requires-python = ">=3.11"
# No analysis code runs here: experiments, figures and numbers come from the research
# repositories. The container only runs pytest and ruff.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache"]

[tool.ruff.lint]
# Full-width punctuation is normal in Japanese comments and strings.
allowed-confusables = ["（", "）", "：", "，", "；"]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# importlib mode leaves sys.path alone: the tests load the tools by path (tests/conftest.py).
addopts = "-ra --import-mode=importlib --strict-markers"
# Keep the cache off the bind-mounted repository (AGENTS.md, environment rules).
cache_dir = "$HOME/.cache/pytest"
