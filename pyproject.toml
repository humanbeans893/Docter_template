[project]
name = "research-template"
version = "0.1.0"
description = "Reusable research project template for data analysis, figures, and manuscript drafting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "xarray>=2023.0",
    "matplotlib>=3.7",
    "geopandas>=0.14",
    "shapely>=2.0",
    "seaborn>=0.13",
    "numba>=0.58",
    "netCDF4>=1.6",
    "scipy>=1.11",
    "cartopy>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".cache"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "NPY", # numpy
    "PD",  # pandas-vet
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Scripts and tests insert the study root into sys.path before imports.
"projects/*/scripts/**" = ["E402"]
"projects/*/tests/**" = ["E402"]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests", "projects"]
# importlib mode is load-bearing: every study ships identically named
# tests/config.py modules, and only importlib gives them unique identities.
addopts = "-ra --import-mode=importlib --strict-markers"
norecursedirs = ["data", "result", ".cache", ".venv", "__pycache__"]
