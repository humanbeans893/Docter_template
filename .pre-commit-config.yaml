# Git hooks run on the HOST (commits happen on the host), via uvx:
#   uvx pre-commit install        # one-time (or: make hooks)
#   uvx pre-commit run --all-files
# Escape hatch when a hook misfires: git commit --no-verify
# `make lint` (ruff inside Docker, pinned by uv.lock) is the source of truth;
# these hooks are a convenience layer and may lag slightly in version.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024] # data guard: 1 MB per file
        # Figures copied from the research repositories may reach 10 MB (the next hook).
        exclude: ^projects/[^/]+/figures/
      - id: check-added-large-files
        args: [--maxkb=9766] # same 10 MB limit as make security for copied figures
        files: ^projects/[^/]+/figures/
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: '\.bib$' # bib files are regenerated exports; avoid churn
      - id: trailing-whitespace
        # Retain the byte-for-byte shared tools, including their upstream whitespace.
        exclude: '\.bib$|^\.agent-runs/shared/tools/'
      - id: mixed-line-ending
